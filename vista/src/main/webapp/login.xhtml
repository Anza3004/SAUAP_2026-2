<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces.org/ui">

<h:head>
    <title>SAUAP - Iniciar Sesión</title>
</h:head>

<h:body>
    <h:form id="loginForm">
        <h1>PRUEBA 1 - Solo JSF puro</h1>
        <h:messages />
        <p>
            Correo:
            <h:inputText value="#{loginUI.usuario.correo}" />
        </p>
        <p>
            Contraseña:
            <h:inputSecret value="#{loginUI.usuario.contrasena}" />
        </p>
        <p>
            <h:commandButton value="Iniciar sesión" action="#{loginUI.login()}" />
        </p>
    </h:form>
</h:body>
</html>
