<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAUAP · Iniciar Sesión</title>
    <h:outputStylesheet library="css" name="styles.css" />
    <style>
        /* Estilos específicos del login */
        body {
            margin: 0;
            background: linear-gradient(135deg, #0f3d2b 0%, #155c3d 100%);
            font-family: "Inter", system-ui, sans-serif;
            min-height: 100vh;
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: min(440px, 90vw);
            background: #ffffff;
            border-radius: 18px;
            padding: 40px 36px 32px;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .login-logo {
            width: 180px;
            max-width: 100%;
            height: auto;
            margin: 0 auto 24px;
            display: block;
        }

        .login-title {
            font-family: "Space Grotesk", sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f3d2b;
            margin: 0 0 4px;
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: #5b6b63;
            margin: 0 0 28px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #182620;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            box-sizing: border-box;
            height: 46px;
            padding: 10px 14px;
            border: 1.5px solid #e1e6e2;
            border-radius: 10px;
            font-size: 0.95rem;
            background: #f6f7f4;
            color: #182620;
            font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        }

        .form-input:focus {
            outline: none;
            border-color: #1c7a4f;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(28, 122, 79, 0.12);
        }

        .btn-login {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #0f7a4a;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.15s, transform 0.1s;
        }

        .btn-login:hover {
            background: #0c683f;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .messages-box {
            background: #fff3f3;
            border: 1px solid #ffcccc;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            color: #b00020;
            font-size: 0.9rem;
            text-align: left;
        }

        .login-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e1e6e2;
            font-size: 0.8rem;
            color: #5b6b63;
            line-height: 1.4;
        }

        .login-footer strong {
            color: #0f3d2b;
        }
    </style>
</h:head>

<h:body>
    <div class="login-wrapper">
        <h:form id="loginForm">
            <div class="login-card">

                <h:graphicImage library="images" name="uabcl.png"
                                styleClass="login-logo" />

                <h2 class="login-title">Iniciar Sesión</h2>
                <p class="login-subtitle">Sistema de Asignación de Unidades de Aprendizaje</p>

                <h:messages styleClass="messages-box" />

                <div class="form-group">
                    <label class="form-label" for="correo">Usuario</label>
                    <h:inputText id="correo"
                                 styleClass="form-input"
                                 value="#{loginUI.usuario.correo}"
                                 autocomplete="off" />
                </div>

                <div class="form-group">
                    <label class="form-label" for="contrasena">Contraseña</label>
                    <h:inputSecret id="contrasena"
                                   styleClass="form-input"
                                   value="#{loginUI.usuario.contrasena}" />
                </div>

                <h:commandButton value="Iniciar sesión"
                                 action="#{loginUI.login()}"
                                 styleClass="btn-login" />

                <div class="login-footer">
                    <strong>Universidad Autónoma de Baja California</strong><br />
                    Sistema de Asignación de Unidades de Aprendizaje para Profesores
                </div>
            </div>
        </h:form>
    </div>
</h:body>
</html>
