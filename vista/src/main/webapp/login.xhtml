<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAUAP · Iniciar Sesión</title>
    <h:outputStylesheet library="css" name="styles.css" />
    <style>
        /* Estilos específicos del login */
        body {
            margin: 0;
            background: linear-gradient(135deg, #0f3d2b 0%, #155c3d 100%);
            font-family: "Inter", system-ui, sans-serif;
            min-height: 100vh;
        }
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-card {
            width: min(440px, 90vw);
            background: #ffffff;
            border-radius: 18px;
            padding: 40px 36px 32px;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .login-logo {
            width: 180px;
            max-width: 100%;
            height: auto;
            margin: 0 auto 24px;
            display: block;
        }
        .login-title {
            font-family: "Space Grotesk", sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f3d2b;
            margin: 0 0 4px;
        }
        .login-subtitle {
            font-size: 0.9rem;
            color: #5b6b63;
            margin: 0 0 28px;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #182620;
            margin-bottom: 6px;
        }
        .btn-login {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #0f7a4a !important;
            color: #ffffff !important;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 8px;
        }
        .btn-login:hover {
            background: #0c683f !important;
        }
        .login-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e1e6e2;
            font-size: 0.8rem;
            color: #5b6b63;
            line-height: 1.4;
        }
        .login-footer strong {
            color: #0f3d2b;
        }
    </style>
</h:head>

<h:body>
    <div class="login-wrapper">
        <h:form id="loginForm">
            <div class="login-card">

                <h:graphicImage library="images" name="uabcl.png"
                                styleClass="login-logo" />

                <h2 class="login-title">Iniciar Sesión</h2>
                <p class="login-subtitle">Sistema de Asignación de Unidades de Aprendizaje</p>

                <p:growl id="msgs" showDetail="true" life="4000" />

                <div class="form-group">
                    <label class="form-label" for="correo">Usuario</label>
                    <p:inputText id="correo"
                                 styleClass="form-input"
                                 value="#{loginUI.usuario.correo}"
                                 autocomplete="off"
                                 required="true"
                                 requiredMessage="El usuario es obligatorio" />
                </div>

                <div class="form-group">
                    <label class="form-label" for="contrasena">Contraseña</label>
                    <p:password id="contrasena"
                                styleClass="form-input"
                                value="#{loginUI.usuario.contrasena}"
                                feedback="false"
                                required="true"
                                requiredMessage="La contraseña es obligatoria" />
                </div>

                <p:commandButton value="Iniciar sesión"
                                 action="#{loginUI.login()}"
                                 styleClass="btn-login"
                                 ajax="false" />

                <div class="login-footer">
                    <strong>Universidad Autónoma de Baja California</strong><br />
                    Sistema de Asignación de Unidades de Aprendizaje para Profesores
                </div>
            </div>
        </h:form>
    </div>
</h:body>
</html>
