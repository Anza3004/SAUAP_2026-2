<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAUAP · Sistema de Asignación de Unidades de Aprendizaje</title>
    <h:outputStylesheet library="css" name="styles.css" />
</h:head>

<h:body>
    <div class="app">

        <div class="overlay" id="overlay"></div>

        <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
            <div class="brand-mini">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="#e8871e" stroke-width="1.6" />
                    <path d="M8 13c0-2.4 1.7-4 3.6-4 1.6 0 2.9 1 2.9 2.4 0 1.1-.8 1.8-1.9 1.8-.8 0-1.3-.4-1.3-1" stroke="#eef6f1" stroke-width="1.5" stroke-linecap="round" />
                </svg>
                <span>SAUAP</span>
            </div>

            <nav class="primary-nav">
                <button class="nav-item active" data-nav="inicio">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5" /><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9" /></svg>
                    Inicio
                </button>

                <button class="nav-item" data-nav="profesores">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2" /><path d="M3.5 19c.6-3.2 2.9-5 5.5-5s4.9 1.8 5.5 5" /><path d="M15.5 8.3a3 3 0 1 1 3.2 5" /><path d="M15 14.3c2.2.2 4 1.9 4.5 4.7" /></svg>
                    Profesores
                </button>

                <button class="nav-item" data-nav="materias">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H17a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6.5A1.5 1.5 0 0 1 5 19.5v-15Z" /><path d="M5 17.2c.5-.3 1-.5 1.6-.5H18" /><path d="M9 7.5h5M9 10.5h5" /></svg>
                    Materias
                </button>

                <button class="nav-item" data-nav="asignaciones">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="1.6" /><path d="M9 3.5h6a1 1 0 0 1 1 1V6H8V4.5a1 1 0 0 1 1-1Z" /><path d="m9 13 2 2 4-4.3" /></svg>
                    Asignaciones
                </button>

                <button class="nav-item expandable" id="consultasToggle" aria-expanded="false" aria-controls="consultasSub">
                        <span class="row">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.2" /><path d="m20 20-4.6-4.6" /></svg>
                            Consultas
                        </span>
                    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
                </button>
                <div class="submenu" id="consultasSub">
                    <div>
                        <a href="#">Asignación por profesor</a>
                        <a href="#">Búsqueda por unidad</a>
                    </div>
                </div>
            </nav>

            <div class="sidebar-foot">
                <h:form>
                    <button class="nav-item" type="submit" onclick="return false;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3" /><path d="M10 8l-4 4 4 4" /><path d="M6 12h12" /></svg>
                        Cerrar sesión
                    </button>
                </h:form>
            </div>
        </aside>

        <div class="content">
            <div class="topbar">
                <button class="menu-toggle" id="menuToggle" aria-label="Abrir navegación">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
                </button>

                <div class="user-menu">
                    <button class="user-chip" id="userToggle" aria-expanded="false">
                            <span class="avatar">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2" /><path d="M5 20c.8-3.8 3.4-6 7-6s6.2 2.2 7 6" /></svg>
                            </span>
                        #{sessionBean.usuarioLogueado.correo}
                        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
                    </button>
                </div>
            </div>

            <main>
                <div class="hero-card">
                    <h:graphicImage library="images" name="SAUAPLOGO.jpeg" alt="Logo SAUAP UABC" styleClass="mark" />
                </div>
            </main>
        </div>
    </div>

    <script type="text/javascript">
        //<![CDATA[
        // Submenu de Consultas
        var consultasToggle = document.getElementById('consultasToggle');
        var consultasSub = document.getElementById('consultasSub');
        consultasToggle.addEventListener('click', function() {
            var open = consultasSub.classList.toggle('open');
            consultasToggle.setAttribute('aria-expanded', open);
        });

        // Sidebar mobile
        var sidebar = document.getElementById('sidebar');
        var overlay = document.getElementById('overlay');
        var menuToggle = document.getElementById('menuToggle');
        function closeSidebarOnMobile(){
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
        }
        menuToggle.addEventListener('click', function() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        });
        overlay.addEventListener('click', closeSidebarOnMobile);
        //]]>
    </script>

</h:body>
</html>
